# Run by entrypoint.sh on every start, before srcds, so nothing has these open.

# Files named by date are finished once a newer one exists: delete them at 30
# days. This must stay "daily": with "size", logrotate ignores minage and
# deletes them all.
/data/csgo/logs/L*.log
/data/csgo/addons/sourcemod/logs/L20*.log
/data/csgo/addons/sourcemod/logs/*_20[0-9][0-9][01][0-9][0-3][0-9].log
/data/csgo/addons/sourcemod/logs/*/*_20[0-9][0-9][01][0-9][0-3][0-9].log
/data/crashdumps/*.dmp
/data/crashdumps/*.dmp.txt
{
    daily
    rotate 0
    minage 30
    missingok
    nocreate
    ignoreduplicates
}

/data/csgo/logs/console-*.log {
    daily
    rotate 30
    compress
    missingok
    nocreate
}

# Any other log is one file holding a plugin's whole history: cap its size.
/data/csgo/addons/sourcemod/logs/*.log
/data/csgo/addons/sourcemod/logs/*/*.log
{
    size 10M
    rotate 3
    compress
    missingok
    nocreate
    ignoreduplicates
}
