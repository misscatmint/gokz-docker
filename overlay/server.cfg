hostname "GOKZ Server" // name in the server browser
sv_password "" // set to make the server private
sv_downloadurl "http://csgo-kz-maps.badservers.net/fastdl" // where players download maps from

log on
autorestart_time "05:00" // 5:00 AM UTC (change to suit your server)
host_players_show 2
host_info_show 2
mp_autokick 0
mp_timelimit 0
sv_allowdownload 1
sv_allowupload 0
sv_logbans 1
sv_minrate 98304
sv_pure 0
sv_reliableavatardata 1

sv_autobunnyhopping 0
sv_cheats 0
// loads these back if someone unloaded them to test with sv_cheats 1
sm plugins load gokz-anticheat.smx
sm plugins load gokz-global.smx
sm plugins load gokz-replays.smx
sm plugins load gokz-localranks.smx
sm plugins load gokz-localdb.smx
gokz_settings_enforcer 1
